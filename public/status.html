<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F3B2E">
    <title>สถานะออเดอร์ | โรงแรม แม่ยม พาเลส</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="maeyom-header">
        <div class="container">
            <div class="maeyom-header-inner">
                <div class="maeyom-logo">
                    <div class="maeyom-logo-mark">M</div>
                    <div class="maeyom-logo-text">
                        <div class="maeyom-logo-name">แม่ยม พาเลส</div>
                        <div class="maeyom-logo-sub">Order Status</div>
                    </div>
                </div>
                <a href="menu.html" class="btn btn-secondary btn-sm">
                    + เพิ่มเมนู
                </a>
            </div>
        </div>
    </header>
    
    <main class="container-sm" style="padding: 24px 20px 100px;">
        <div id="loading" class="text-center" style="padding: 60px 20px;">
            <div class="spinner" style="margin: 0 auto 16px;"></div>
            <p style="color: var(--color-stone);">กำลังโหลดข้อมูล...</p>
        </div>
        
        <div id="order-content" class="hidden">
            <!-- Order Header Card -->
            <div class="card card-luxury mb-6 animate-fade-in-up">
                <div style="text-align: center;">
                    <div id="status-icon" style="font-size: 64px; margin-bottom: 12px;">⏳</div>
                    <h1 id="status-label" style="font-family: var(--font-display); font-size: 32px; color: var(--color-emerald-dark); margin-bottom: 8px;">รอ</h1>
                    <p id="status-message" style="color: var(--color-stone); margin-bottom: 16px;"></p>
                    <div style="display: inline-block; padding: 8px 20px; background: var(--color-emerald-dark); color: var(--color-gold-light); border-radius: var(--radius-full); font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.05em;">
                        <span id="order-number">ORD-XXXXXXXX-XXX</span>
                    </div>
                </div>
                
                <div class="divider-luxury">
                    <span class="divider-luxury-icon">❀</span>
                </div>
                
                <!-- Status Timeline -->
                <div class="status-timeline" id="status-timeline">
                    <!-- Generated by JS -->
                </div>
            </div>
            
            <!-- Customer Info -->
            <div class="card mb-6 animate-fade-in-up" style="animation-delay: 0.1s;">
                <h3 style="font-family: var(--font-display); font-size: 20px; margin-bottom: 16px; color: var(--color-emerald-dark);">
                    👤 ข้อมูลลูกค้า
                </h3>
                <div class="info-row">
                    <span class="info-label">ชื่อ:</span>
                    <span id="customer-name"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">เบอร์:</span>
                    <span id="customer-phone"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">ประเภท:</span>
                    <span id="order-type"></span>
                </div>
                <div class="info-row" id="table-row">
                    <span class="info-label">โต๊ะ:</span>
                    <span id="table-number"></span>
                </div>
            </div>
            
            <!-- Order Items -->
            <div class="card mb-6 animate-fade-in-up" style="animation-delay: 0.2s;">
                <h3 style="font-family: var(--font-display); font-size: 20px; margin-bottom: 16px; color: var(--color-emerald-dark);">
                    🍽️ รายการอาหาร
                </h3>
                <div id="order-items"></div>
                
                <div class="order-total">
                    <span>รวมทั้งสิ้น</span>
                    <span id="order-total" style="font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--color-gold-dark);">฿0</span>
                </div>
            </div>
            
            <!-- Notes -->
            <div id="notes-section" class="card mb-6 hidden animate-fade-in-up" style="animation-delay: 0.3s;">
                <h3 style="font-family: var(--font-display); font-size: 18px; margin-bottom: 8px; color: var(--color-emerald-dark);">
                    📝 หมายเหตุ
                </h3>
                <p id="order-notes" style="color: var(--color-graphite); font-style: italic;"></p>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-grid animate-fade-in-up" style="animation-delay: 0.4s;">
                <a href="menu.html" class="btn btn-primary btn-lg">
                    ➕ สั่งเพิ่ม
                </a>
                <a id="call-admin" href="tel:" class="btn btn-emerald btn-lg">
                    📞 โทรหาแอดมิน
                </a>
            </div>
        </div>
    </main>
    
    <style>
        .status-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 16px 0 8px;
        }
        
        .status-timeline::before {
            content: '';
            position: absolute;
            top: 32px;
            left: 8%;
            right: 8%;
            height: 2px;
            background: var(--color-cream-dark);
            z-index: 0;
        }
        
        .timeline-step {
            position: relative;
            z-index: 1;
            text-align: center;
            flex: 1;
        }
        
        .timeline-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--color-cream-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin: 0 auto 8px;
            transition: all 0.4s;
        }
        
        .timeline-step.active .timeline-circle {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            border-color: var(--color-gold);
            color: white;
            box-shadow: var(--shadow-gold);
            transform: scale(1.15);
        }
        
        .timeline-step.current .timeline-circle {
            animation: pulse-gold 2s infinite;
        }
        
        .timeline-step.completed .timeline-circle {
            background: var(--color-completed);
            border-color: var(--color-completed);
            color: white;
        }
        
        .timeline-label {
            font-size: 11px;
            color: var(--color-stone);
            font-weight: 600;
        }
        
        .timeline-step.active .timeline-label,
        .timeline-step.current .timeline-label {
            color: var(--color-emerald-dark);
        }
        
        .info-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px dashed var(--color-cream-dark);
            gap: 12px;
        }
        
        .info-row:last-child { border-bottom: none; }
        
        .info-label {
            min-width: 80px;
            color: var(--color-stone);
            font-weight: 600;
            font-size: 14px;
        }
        
        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--color-cream-dark);
            gap: 12px;
        }
        
        .order-item-row:last-of-type { border-bottom: none; }
        
        .order-item-name {
            font-weight: 600;
            color: var(--color-emerald-dark);
        }
        
        .order-item-detail {
            font-size: 13px;
            color: var(--color-stone);
            margin-top: 2px;
        }
        
        .order-item-subtotal {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--color-gold-dark);
            min-width: 80px;
            text-align: right;
        }
        
        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            margin-top: 16px;
            border-top: 2px dashed var(--color-gold);
            font-size: 16px;
            font-weight: 600;
        }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        @media (max-width: 480px) {
            .action-grid { grid-template-columns: 1fr; }
            .timeline-label { font-size: 10px; }
        }
    </style>
    
    <script src="js/config.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        let supabase = null;
        let orderId = null;
        let currentOrder = null;
        let realtimeChannel = null;
        
        const statusOrder = ['pending', 'accepted', 'cooking', 'ready', 'delivering', 'completed'];
        
        window.addEventListener('DOMContentLoaded', async () => {
            supabase = initSupabase();
            if (!supabase) return;
            
            const params = new URLSearchParams(window.location.search);
            orderId = params.get('id');
            
            if (!orderId) {
                // ลองหาจาก localStorage
                const myOrders = JSON.parse(localStorage.getItem('maeyom_my_orders') || '[]');
                if (myOrders.length > 0) {
                    orderId = myOrders[0];
                } else {
                    alert('ไม่พบข้อมูลออเดอร์');
                    window.location.href = 'menu.html';
                    return;
                }
            }
            
            await loadOrder();
            subscribeToUpdates();
            
            // ปุ่มโทรหาแอดมิน
            document.getElementById('call-admin').href = `tel:${CONFIG.HOTEL_PHONE}`;
        });
        
        async function loadOrder() {
            const { data, error } = await supabase
                .from('orders')
                .select(`
                    *,
                    order_items(*)
                `)
                .eq('id', orderId)
                .single();
            
            if (error || !data) {
                document.getElementById('loading').innerHTML = `
                    <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                    <p style="color: var(--color-stone);">ไม่พบข้อมูลออเดอร์</p>
                    <a href="menu.html" class="btn btn-primary mt-4">กลับหน้าเมนู</a>`;
                return;
            }
            
            currentOrder = data;
            renderOrder();
        }
        
        function renderOrder() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('order-content').classList.remove('hidden');
            
            const statusInfo = ORDER_STATUS[currentOrder.status];
            document.getElementById('status-icon').textContent = statusInfo.icon;
            document.getElementById('status-label').textContent = statusInfo.label;
            document.getElementById('status-message').textContent = notifier.getStatusMessage(currentOrder.status);
            document.getElementById('order-number').textContent = currentOrder.order_number;
            
            document.getElementById('customer-name').textContent = currentOrder.customer_name;
            document.getElementById('customer-phone').textContent = currentOrder.customer_phone;
            
            const orderTypeInfo = ORDER_TYPE[currentOrder.order_type];
            document.getElementById('order-type').innerHTML = `${orderTypeInfo.icon} ${orderTypeInfo.label}`;
            
            if (currentOrder.table_number) {
                document.getElementById('table-number').textContent = `โต๊ะ ${currentOrder.table_number}`;
                document.getElementById('table-row').classList.remove('hidden');
            } else {
                document.getElementById('table-row').classList.add('hidden');
            }
            
            // Timeline
            renderTimeline();
            
            // Order items
            const itemsHtml = currentOrder.order_items.map(item => `
                <div class="order-item-row">
                    <div style="flex:1;">
                        <div class="order-item-name">${item.menu_name}</div>
                        <div class="order-item-detail">฿${Number(item.menu_price).toLocaleString()} × ${item.quantity}</div>
                        ${item.notes ? `<div class="order-item-detail" style="color:var(--color-gold-dark);font-style:italic;">📝 ${item.notes}</div>` : ''}
                    </div>
                    <div class="order-item-subtotal">฿${Number(item.subtotal).toLocaleString()}</div>
                </div>
            `).join('');
            
            document.getElementById('order-items').innerHTML = itemsHtml;
            document.getElementById('order-total').textContent = `฿${Number(currentOrder.total_amount).toLocaleString()}`;
            
            if (currentOrder.notes) {
                document.getElementById('notes-section').classList.remove('hidden');
                document.getElementById('order-notes').textContent = currentOrder.notes;
            }
        }
        
        function renderTimeline() {
            const currentIdx = statusOrder.indexOf(currentOrder.status);
            const isCancelled = currentOrder.status === 'cancelled';
            
            const labels = {
                pending: 'รอ',
                accepted: 'รับ',
                cooking: 'ทำ',
                ready: 'เสร็จ',
                delivering: 'จัดส่ง',
                completed: 'เสร็จสิ้น'
            };
            
            const html = statusOrder.map((s, idx) => {
                let className = 'timeline-step';
                if (isCancelled) {
                    className += idx <= 0 ? ' active' : '';
                } else if (idx < currentIdx) {
                    className += ' active completed';
                } else if (idx === currentIdx) {
                    className += ' active current';
                }
                
                return `
                    <div class="${className}">
                        <div class="timeline-circle">${ORDER_STATUS[s].icon}</div>
                        <div class="timeline-label">${labels[s]}</div>
                    </div>`;
            }).join('');
            
            document.getElementById('status-timeline').innerHTML = html;
        }
        
        // Realtime subscribe
        function subscribeToUpdates() {
            realtimeChannel = supabase
                .channel(`order-${orderId}`)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'orders',
                    filter: `id=eq.${orderId}`
                }, (payload) => {
                    const oldStatus = currentOrder.status;
                    const newStatus = payload.new.status;
                    
                    currentOrder = { ...currentOrder, ...payload.new };
                    renderOrder();
                    
                    if (oldStatus !== newStatus) {
                        notifier.notifyStatusChange(currentOrder, newStatus);
                        notifier.showToast(
                            `${ORDER_STATUS[newStatus].icon} สถานะ: ${ORDER_STATUS[newStatus].label}`,
                            'order',
                            5000
                        );
                    }
                })
                .subscribe();
        }
        
        window.addEventListener('beforeunload', () => {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);
        });
    </script>
</body>
</html>
